<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Quetzal Database</title>
  <link rel="icon" type="image/png" href="Icono.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR (Opción A) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="https://raw.githubusercontent.com/nellyama7w7/QuetzalSprites/main/PokemonSprites/RAYQUAZA.png"
             alt="Quetzal Logo"
             width="28" height="28">
        <span>Quetzal DB</span>
      </div>

      <nav class="sidebar-nav" aria-label="Navegación principal">
        <button type="button" class="side-nav active" data-tab="home">
          <span class="side-dot" style="background:#00c853"></span>
          Inicio
        </button>
        <button type="button" class="side-nav" data-tab="pokemon">
          <span class="side-dot" style="background:#00c853"></span>
          Pokémon
          <span class="side-count" id="sideCountPokemon">—</span>
        </button>
        <button type="button" class="side-nav" data-tab="objetos">
          <span class="side-dot" style="background:#FFD700"></span>
          Objetos
          <span class="side-count" id="sideCountObjetos">—</span>
        </button>
        <button type="button" class="side-nav" data-tab="habilidades">
          <span class="side-dot" style="background:#9c88ff"></span>
          Habilidades
          <span class="side-count" id="sideCountHabilidades">—</span>
        </button>
        <button type="button" class="side-nav" data-tab="creditos">
          <span class="side-dot" style="background:#888"></span>
          Créditos
        </button>
      </nav>

      <div class="sidebar-regions" id="sidebarRegions">
        <div class="side-region-label">Regiones</div>
        <div id="regionList"></div>
      </div>

      <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Cerrar menú">
        <span aria-hidden="true">‹</span>
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-area">
      <header class="main-top">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
        <div class="search-wrapper">
          <label class="sr-only" for="search">Buscar en la base de datos</label>
          <input
            type="text"
            id="search"
            placeholder="Buscar Pokémon, número, objeto, habilidad..."
            class="search-input"
          >
        </div>
        <div class="main-result-count" id="resultCount"></div>
      </header>

      <div class="main-body">
        <div id="results" class="results-grid"></div>
      </div>
    </div>
  </div>

  <!-- Overlay móvil -->
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <!-- Modal -->
  <div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-content" tabindex="-1">
      <button class="close" type="button" aria-label="Cerrar detalle">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
